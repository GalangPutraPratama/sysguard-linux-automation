# SysGuard Configuration
# Copy to config/config.conf and adjust as needed

# Container
CONTAINER_NAME="sysguard-nginx"
COMPOSE_FILE="docker/compose.yaml"

# Directories
DATA_DIR="data/source"
BACKUP_DIR="backups"
RESTORE_DIR="data/restored"
LOG_DIR="logs"

# Thresholds
MIN_FREE_SPACE_MB=100
MAX_BACKUP_COUNT=5
DISK_THRESHOLD=80

# Log
LOG_FILE="logs/sysguard.log"

# SSH Access
SSH_PORT=2222
SSH_USER="sysguard"
